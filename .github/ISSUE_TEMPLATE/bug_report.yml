name: Bug report
description: Report a problem with YeelightClient
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out as much of this as you can.
  - type: input
    id: library-version
    attributes:
      label: YeelightClient version
      description: The NuGet package version you are using.
      placeholder: "1.0.0-beta.2"
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: Target framework / .NET version
      placeholder: "net10.0 / .NET 10.0.0"
    validations:
      required: true
  - type: input
    id: light
    attributes:
      label: Light model and firmware version
      description: The `model` and `fw_ver` of the light, as its discovery answer reports them.
      placeholder: "color / 85"
    validations:
      required: true
  - type: dropdown
    id: discovery
    attributes:
      label: How was the light found?
      description: Skip this when the problem has nothing to do with finding a light.
      options:
        - "Search: multicast and broadcast (the default)"
        - "Search: multicast only (broadcast switched off)"
        - "Announcement: the light announced itself (listening)"
        - "Probe: a search sent to one address"
        - Not sure
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact exception/stack trace if there was one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps to reproduce, or a minimal code snippet.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
